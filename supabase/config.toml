# Supabase CLI config for local development.
# `supabase start` reads this and boots Postgres + Auth + Storage on:
#   - API:      http://127.0.0.1:54321
#   - DB:       postgresql://postgres:postgres@127.0.0.1:54322/postgres
#   - Studio:   http://127.0.0.1:54323
project_id = "mwrd"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3001",
  "http://localhost:3002",
  "http://localhost:3003",
  "http://localhost:3001/**",
  "http://localhost:3002/**",
  "http://localhost:3003/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Skip email-link verification in local dev — sign-up is immediately usable.
enable_confirmations = false
double_confirm_changes = false

# Custom Access Token Hook — stamps active_company_id / active_vendor_id into
# the JWT claims. Required by RLS policies that gate by JWT claim.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = false
